name: E2E — Barter Flow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      E2E_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install Python deps (Playwright + requests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          # انتظر جاهزية localhost:8080
          for i in {1..60}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "✓ dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "✗ dev server did not start"; tail -50 /tmp/dev.log; exit 1

      - name: Run E2E (bun run test:e2e)
        id: e2e
        run: bun run test:e2e

      - name: Append summary to GitHub step summary
        if: always()
        run: |
          if [ -f /tmp/browser/barter/summary.md ]; then
            cat /tmp/browser/barter/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠ no summary.md produced by the test run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full browser artifacts (screenshots + traces + summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-barter-${{ github.run_id }}
          path: /tmp/browser/barter/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
