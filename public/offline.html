<!doctype html>
<html lang="ar" dir="rtl">

      p { color:#57534e; font-size:.95rem; line-height:1.8; margin:0 0 1.5rem; }
      a { display:inline-block; background:#059669; color:#fff; text-decoration:none;
          padding:.65rem 1.4rem; border-radius:999px; font-weight:700; font-size:.9rem; }

  <body>
    <div class="box">
      <h1>لا يوجد اتصال بالإنترنت</h1>

      <a href="/">إعادة المحاولة</a>
    </div>
